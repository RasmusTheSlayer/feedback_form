<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ action }} запись</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;800&family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #202020;
            color: #fff;
            font-family: 'Inter', sans-serif;
        }
        .container {
            max-width: 600px;
        }
        .card {
            background-color: #2a2a2a;
            border: none;
        }
        .card-header {
            background-color: #333;
            border-bottom: 1px solid #444;
        }
        .form-control {
            background-color: transparent;
            border: none;
            border-bottom: 1px solid #666;
            border-radius: 0;
            color: #fff;
            padding-left: 0;
        }
        .form-control:focus {
            background-color: transparent;
            border-color: #fff;
            box-shadow: none;
        }
        .form-label {
            color: #aaa;
            text-transform: uppercase;
            font-size: 0.8rem;
            letter-spacing: 0.5px;
        }
        .btn-brown {
            background-color: #684a35;
            color: #fff;
            border: none;
        }
        .btn-brown:hover {
            background-color: #7a5a43;
            color: #fff;
        }
        .btn-outline-light {
            border-color: #555;
        }
        .btn-outline-light:hover {
            background-color: #444;
            color: #fff;
        }
        .flash-messages {
            margin-top: 20px;
        }
        .flash-messages .alert {
            background-color: #2a2a2a;
            border: 1px solid #444;
            color: #eee;
        }
        .flash-messages .alert-success {
            border-color: #4ade80;
            color: #4ade80;
        }
        .flash-messages .alert-danger {
            border-color: #ff6b6b;
            color: #ff6b6b;
        }
        a {
            color: #a0a0a0;
            text-decoration: none;
        }
        a:hover {
            color: #fff;
        }
    </style>
</head>
<body>
    <div class="container my-5">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1 class="h4" style="font-family: 'Unbounded', sans-serif;">{{ action }} запись</h1>
            <a href="{{ url_for('admin_index') }}" class="btn btn-outline-light">← Назад</a>
        </div>

        <!-- Flash-сообщения -->
        <div class="flash-messages">
            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    {% for category, message in messages %}
                        <div class="alert alert-{{ category }}">{{ message }}</div>
                    {% endfor %}
                {% endif %}
            {% endwith %}
        </div>

        <div class="card">
            <div class="card-body">
                <form method="POST">
                    <div class="mb-3">
                        <label for="name" class="form-label">Имя и фамилия *</label>
                        <input type="text" id="name" name="name" class="form-control" value="{{ record.name if record else '' }}" required>
                    </div>
                    <div class="mb-3">
                        <label for="email" class="form-label">Email *</label>
                        <input type="email" id="email" name="email" class="form-control" value="{{ record.email if record else '' }}" required>
                    </div>
                    <div class="mb-3">
                        <label for="tg_user" class="form-label">Telegram</label>
                        <input type="text" id="tg_user" name="tg_user" class="form-control" value="{{ record.tg_user if record else '' }}">
                    </div>
                    <button type="submit" class="btn btn-brown w-100">Сохранить</button>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
