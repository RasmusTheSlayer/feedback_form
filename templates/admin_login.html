<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход в админ-панель</title>
    <!-- Подключаем те же шрифты, что и на основном сайте -->
    <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;800&family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <style>
        /* Переиспользуем стили из основного CSS */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }
        body {
            background-color: #202020;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .login-container {
            max-width: 400px;
            width: 100%;
            padding: 40px 20px;
            text-align: center;
        }
        h1 {
            font-family: 'Unbounded', sans-serif;
            font-size: 1.8rem;
            font-weight: 800;
            letter-spacing: 1px;
            margin-bottom: 30px;
            text-transform: uppercase;
            color: #ffffff;
        }
        .field {
            margin-bottom: 25px;
            text-align: left;
        }
        label {
            display: block;
            font-size: 0.9rem;
            color: #a0a0a0;
            text-transform: uppercase;
            margin-bottom: 8px;
            letter-spacing: 0.5px;
        }
        input {
            width: 100%;
            background: transparent;
            border: none;
            border-bottom: 1px solid #666;
            color: #ffffff;
            font-size: 1.2rem;
            padding: 10px 0;
            outline: none;
            border-radius: 0;
        }
        input:focus {
            border-bottom: 2px solid #ffffff;
        }
        .btn-brown {
            background-color: #684a35;
            color: #ffffff;
            border: none;
            padding: 16px 30px;
            border-radius: 40px;
            width: 100%;
            font-size: 1.1rem;
            font-weight: 600;
            text-transform: uppercase;
            cursor: pointer;
            transition: opacity 0.3s;
            margin-top: 10px;
        }
        .btn-brown:hover {
            opacity: 0.8;
        }
        .error {
            color: #ff6b6b;
            margin-top: 10px;
            font-size: 0.95rem;
        }
        .back-link {
            display: block;
            margin-top: 20px;
            color: #888;
            font-size: 0.9rem;
            text-decoration: none;
        }
        .back-link:hover {
            color: #ccc;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <h1>Вход в админку</h1>

        {% if error %}
            <div class="error">{{ error }}</div>
        {% endif %}

        <form method="post">
            <div class="field">
                <label for="username">Логин</label>
                <input type="text" id="username" name="username" placeholder="Введите логин" required>
            </div>
            <div class="field">
                <label for="password">Пароль</label>
                <input type="password" id="password" name="password" placeholder="Введите пароль" required>
            </div>
            <button class="btn-brown" type="submit">Войти</button>
        </form>

        <a href="{{ url_for('index_view') }}" class="back-link">← Вернуться на главную</a>
    </div>
</body>
</html>
